[package]
name = "k750-native"
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Guarded DB2010 device profile using the Samsung emulator's portable ARM runtime"
publish = false

[dependencies]
db2010-host = { path = "../db2010-host" }
e830 = { package = "samsung-e830-emulator", path = "../../dependencies/samsung-runtime", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicorn-engine = { version = "=2.1.5", default-features = false, features = ["arch_arm"] }

