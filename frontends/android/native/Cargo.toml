[package]
name = "e830-android-jni"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
build = "build.rs"

[lib]
name = "e830_android_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde_json = "1"
e830 = { package = "samsung-e830-emulator", path = "../../../dependencies/samsung-runtime", default-features = false }
k750-native = { path = "../../../native/k750" }
db2010-host = { path = "../../../native/db2010-host" }

