[package]
name = "samsung-e830-emulator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Samsung phone firmware emulator with E830 and experimental N500 device profiles"

[lib]
name = "e830"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "e830-emulator"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "e830-cli"
path = "src/cli.rs"

[[bin]]
name = "onenand-loader-probe"
path = "tools/onenand-loader-probe.rs"
test = false

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
unicorn-engine = { version = "=2.1.5", default-features = false, features = ["arch_arm"] }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
rfd = { version = "0.14", default-features = false, features = ["gtk3"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "phone-cli"
path = "src/phone_cli.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
